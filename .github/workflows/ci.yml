name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install snakemake pandas numpy scipy scikit-learn statsmodels pytest
      - run: pytest -q tests
      - run: python tests/make_synthetic.py
      - run: snakemake -c2 --configfile config/test.yaml
